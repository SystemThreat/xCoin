<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- SuperKnet social card: the acid-lime brutalist system (paper white, 2px #111 rules, #c7ff2e accent) -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <g stroke="#d7d7d7" stroke-width="1">
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="420" x2="1200" y2="420"/>
  </g>
  <!-- brand mark -->
  <rect x="80" y="84" width="96" height="96" fill="#c7ff2e" stroke="#111111" stroke-width="4"/>
  <text x="128" y="152" text-anchor="middle" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-weight="900" font-size="46" letter-spacing="-4" fill="#101600">XC</text>
  <text x="200" y="130" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-weight="900" font-size="44" letter-spacing="-2" fill="#0a0a0a">xCoin <tspan fill="#626262">/ SuperKnet</tspan></text>
  <text x="200" y="166" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-weight="800" font-size="20" letter-spacing="3" fill="#626262">XCOIN EXPLORER</text>
  <!-- headline block -->
  <rect x="80" y="236" width="1040" height="234" fill="#0a0a0a"/>
  <text x="120" y="330" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-weight="900" font-size="78" letter-spacing="-5" fill="#ffffff">THE CHAIN, IN THE OPEN.</text>
  <text x="120" y="420" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-weight="900" font-size="78" letter-spacing="-5" fill="#c7ff2e">JOIN THE MINERS.</text>
  <!-- tagline -->
  <text x="80" y="530" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-weight="700" font-size="26" fill="#0a0a0a">The post-quantum xCoin (XCF) block explorer</text>
  <text x="80" y="572" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-weight="500" font-size="22" fill="#626262">21,000,000 XCF cap · witness v3 addresses · MetalDAG proof of work</text>
  <rect x="1192" y="0" width="8" height="630" fill="#c7ff2e"/>
</svg>
